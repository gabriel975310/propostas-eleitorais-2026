# Publicação do Propostas 2026.
# O site é um único HTML autocontido: não há etapa de build no Netlify.
# Para atualizar os dados e republicar, rode localmente:
#     python3 site/refresh.py && python3 site/deploy.py
[build]
  publish = "dist"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# o HTML carrega fontes do Google; o resto é tudo inline
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
