# Rebaixa as fontes vivas, reconstrói o HTML e publica no Netlify.
#
# Roda sozinho todo dia às 08:00 de Brasília, e sob demanda pelo botão
# "Run workflow" na aba Actions.
#
# Precisa de dois segredos no repositório (Settings > Secrets and variables >
# Actions):
#   NETLIFY_AUTH_TOKEN  token pessoal do Netlify (User settings > Applications)
#   NETLIFY_SITE_ID     4184f2d7-a33f-4ae6-8d55-a5b913f4728a
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 08:00 BRT
  workflow_dispatch:

concurrency:
  group: atualizar
  cancel-in-progress: false

permissions:
  contents: write          # para commitar data/live.json

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebaixar fontes e reconstruir o HTML
        run: python3 site/refresh.py

      - name: Conferir o que foi gerado
        run: |
          test -s data/live.json || { echo "data/live.json vazio"; exit 1; }
          test -s site/espectro-2026.html || { echo "HTML não foi gerado"; exit 1; }
          python3 - <<'PY'
          import json, re, sys
          h = open('site/espectro-2026.html', encoding='utf-8').read()
          m = re.search(r'<script id="dados" type="application/json">(.*?)</script>', h, re.S)
          d = json.loads(m.group(1).replace('<\\/', '</'))
          faltando = [k for k in ('candidatos', 'propostas', 'odds', 'pesquisas') if not d.get(k)]
          if faltando:
              sys.exit('bloco de dados incompleto: %s' % faltando)
          print('ok — capturado em', d.get('capturado'))
          print('   modelo   ', d['odds']['br']['modelo']['atualizado'])
          print('   mercado  ', d['odds']['br']['mercado']['atualizado'])
          print('   pesquisas', d['pesquisas']['atualizado'])
          PY

      - name: Rodar as verificações do projeto
        working-directory: site
        run: |
          node chk.js
          node chk2.js

      - name: Commitar os dados novos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then
            echo "nada mudou nas fontes; seguindo para o deploy mesmo assim"
          else
            git commit -m "dados: atualização automática de $(date -u +%d/%m/%Y)"
            git push
          fi

      - name: Publicar no Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "falta o segredo NETLIFY_AUTH_TOKEN"; exit 1; }
          test -n "$NETLIFY_SITE_ID"    || { echo "falta o segredo NETLIFY_SITE_ID"; exit 1; }
          npm install --no-fund --no-audit --global netlify-cli
          python3 site/deploy.py
