# Rebaixa as fontes vivas, reconstrói o HTML e publica no GitHub Pages.
#
# Roda de duas em duas horas, e sob demanda pelo botão "Run workflow" na aba
# Actions. Duas decisões de agendamento:
#
#   · o minuto :17 evita a hora cheia, a faixa mais congestionada da fila de
#     agendamentos do GitHub, onde disparos costumam atrasar ou se perder;
#   · a frequência alta é o que cobre um disparo perdido — o atraso máximo
#     vira duas horas em vez de um dia inteiro.
#
# Custo: nenhum. Em repositório público os minutos de Actions são ilimitados,
# e o Pages não cobra por publicação — o limite que existe é de banda
# (100 GB/mês) e de ~10 publicações por hora, bem acima das 12 por dia daqui.
#
# Não precisa de segredo nenhum: o GITHUB_TOKEN da própria rodada publica.
#
# Precisa, uma vez só, que o Pages exista e aponte para o Actions:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
# Isso não dá para automatizar — criar o site do Pages exige permissão de
# admin, que o GITHUB_TOKEN não tem mesmo com `pages: write` (o
# actions/configure-pages com enablement responde 403 "Resource not
# accessible by integration"). Depois de criado, o token publica sem
# problema. Também exige repositório público: em privado o Pages é pago.
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: atualizar
  cancel-in-progress: false

permissions:
  contents: write          # para commitar data/live.json
  pages: write             # para publicar
  id-token: write          # o deploy-pages troca este token pelo do Pages

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebaixar fontes e reconstruir o HTML
        id: refresh
        run: python3 site/refresh.py

      - name: Conferir o que foi gerado
        run: |
          test -s data/live.json || { echo "data/live.json vazio"; exit 1; }
          test -s site/espectro-2026.html || { echo "HTML não foi gerado"; exit 1; }
          python3 - <<'PY'
          import json, re, sys
          h = open('site/espectro-2026.html', encoding='utf-8').read()
          m = re.search(r'<script id="dados" type="application/json">(.*?)</script>', h, re.S)
          d = json.loads(m.group(1).replace('<\\/', '</'))
          faltando = [k for k in ('candidatos', 'propostas', 'odds', 'pesquisas') if not d.get(k)]
          if faltando:
              sys.exit('bloco de dados incompleto: %s' % faltando)
          print('ok — capturado em', d.get('capturado'))
          print('   modelo   ', d['odds']['br']['modelo']['atualizado'])
          print('   mercado  ', d['odds']['br']['mercado']['atualizado'])
          print('   pesquisas', d['pesquisas']['atualizado'])
          PY

      - name: Rodar as verificações do projeto
        working-directory: site
        run: |
          node chk.js
          node chk2.js

      - name: Commitar os dados novos
        if: steps.refresh.outputs.mudou == 'sim'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then
            echo "nada mudou nas fontes; seguindo para o deploy mesmo assim"
          else
            git commit -m "dados: atualização automática de $(date -u +%d/%m/%Y)"
            git push
          fi

      # O deploy.py monta o dist/ e, fora do CI, dispara este workflow.
      # Aqui só a montagem interessa.
      - name: Montar o dist/
        run: python3 site/deploy.py --so-montar

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
