# Rebaixa as fontes vivas, reconstrói o HTML e publica no Netlify.
#
# Roda de duas em duas horas, e sob demanda pelo botão "Run workflow" na aba
# Actions. Duas decisões de agendamento:
#
#   · o minuto :17 evita a hora cheia, a faixa mais congestionada da fila de
#     agendamentos do GitHub, onde disparos costumam atrasar ou se perder;
#   · a frequência alta é o que cobre um disparo perdido — o atraso máximo
#     vira duas horas em vez de um dia inteiro.
#
# Custo: ~12 rodadas/dia de ~90s = cerca de 720 min/mês, dentro dos 2000 do
# plano grátis para repositório privado.
#
# Precisa de UM segredo no repositório (Settings > Secrets and variables >
# Actions > New repository secret):
#
#   NETLIFY_AUTH_TOKEN   token pessoal do Netlify
#                        (Netlify > User settings > Applications > Personal access tokens)
#
# O id do site não é segredo — aparece na URL do admin — então vai fixo abaixo.
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: atualizar
  cancel-in-progress: false

permissions:
  contents: write          # para commitar data/live.json

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebaixar fontes e reconstruir o HTML
        id: refresh
        run: python3 site/refresh.py

      - name: Conferir o que foi gerado
        run: |
          test -s data/live.json || { echo "data/live.json vazio"; exit 1; }
          test -s site/espectro-2026.html || { echo "HTML não foi gerado"; exit 1; }
          python3 - <<'PY'
          import json, re, sys
          h = open('site/espectro-2026.html', encoding='utf-8').read()
          m = re.search(r'<script id="dados" type="application/json">(.*?)</script>', h, re.S)
          d = json.loads(m.group(1).replace('<\\/', '</'))
          faltando = [k for k in ('candidatos', 'propostas', 'odds', 'pesquisas') if not d.get(k)]
          if faltando:
              sys.exit('bloco de dados incompleto: %s' % faltando)
          print('ok — capturado em', d.get('capturado'))
          print('   modelo   ', d['odds']['br']['modelo']['atualizado'])
          print('   mercado  ', d['odds']['br']['mercado']['atualizado'])
          print('   pesquisas', d['pesquisas']['atualizado'])
          PY

      - name: Rodar as verificações do projeto
        working-directory: site
        run: |
          node chk.js
          node chk2.js

      - name: Commitar os dados novos
        if: steps.refresh.outputs.mudou == 'sim'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then
            echo "nada mudou nas fontes; seguindo para o deploy mesmo assim"
          else
            git commit -m "dados: atualização automática de $(date -u +%d/%m/%Y)"
            git push
          fi

      # Sem netlify-cli: o deploy.py manda o dist/ como zip pela API quando
      # encontra o token no ambiente. Instalar o CLI custava ~2 min por rodada,
      # o que pesa numa cota de repositório privado rodando de 2 em 2 horas.
      - name: Publicar no Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 4184f2d7-a33f-4ae6-8d55-a5b913f4728a
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Falta o segredo NETLIFY_AUTH_TOKEN."
            echo "Crie um token em Netlify > User settings > Applications > Personal access tokens"
            echo "e adicione em Settings > Secrets and variables > Actions deste repositório."
            exit 1
          fi
          python3 site/deploy.py
