*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);

.mn{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}

.gcard{background:var(--surface);border:1.5px solid var(--rule);border-radius:20px;padding:26px 24px 22px;

.gcard .bar i{flex:1}
.gcard h2{font-size:27px;margin:12px 0 6px}

.hspace{flex:1}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;

.iconbtn:hover{border-color:var(--accent-2);transform:scale(1.06)}
nav.tabs{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 88%,transparent);

main{padding:28px 0 100px;min-height:60vh}
.panel[hidden]{display:none}
section{margin-bottom:40px}
.sechead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sechead h2{font-size:23px}

.lead{color:var(--ink-2);max-width:68ch;margin:0 0 18px;font-size:16.5px}

.chip .sw{width:9px;height:9px;border-radius:50%;flex:none}

:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C0F11}

.ccard .cw{display:flex;gap:13px;align-items:center;padding:15px 16px}
.ccard .cw .ci{min-width:0;flex:1}
.ccard h3{font-size:18px;line-height:1.16}
.ccard .badge{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;

.ccard h3{font-size:19px}
.ccard .sub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.metarow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid var(--rule-2)}
